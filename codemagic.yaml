workflows:
  android-release-build:
    name: Build 0003 Downloader Release APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Generate Keystore & Compile Release APK
        script: |
          touch .env.example
          touch .env

          # 1. رفع تداخل ریسورس‌های آیکون (حذف وب‌پی‌های قدیمی)
          find app/src/main/res/mipmap-* -name "ic_launcher*.webp" -delete || true

          # 2. تولید کی‌استور در صورت عدم وجود
          if [ ! -f "$CM_BUILD_DIR/my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore "$CM_BUILD_DIR/my-upload-key.jks" \
              -storetype PKCS12 \
              -alias upload \
              -keypass ali13821382ali \
              -storepass ali13821382ali \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Ali Ziaee, OU=0003, O=0003 Downloader, L=Tehran, ST=Tehran, C=IR"
          fi

          # 3. دانلود و آماده‌سازی Gradle 9.3.1
          curl -fL --retry 3 --retry-delay 2 "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -o /tmp/gradle-9.3.1-bin.zip
          unzip -q -o /tmp/gradle-9.3.1-bin.zip -d /tmp
          export PATH=/tmp/gradle-9.3.1/bin:$PATH

          # 4. اجرای بیلد نهایی
          gradle assembleRelease --no-daemon --stacktrace
    artifacts:
      - "app/build/outputs/apk/release/*.apk"
      - "$CM_BUILD_DIR/my-upload-key.jks"
